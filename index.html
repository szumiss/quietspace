<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Pomodoro Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      max-width: 400px;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    #timer {
      font-size: 72px;
      margin-bottom: 20px;
      font-weight: 700;
      color: #34495e;
    }
    button {
      background: #2c3e50;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 5px;
    }
    button:hover {
      background: #34495e;
    }
    #musicToggle {
      background: #16a085;
    }
    #musicToggle:hover {
      background: #1abc9c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pomodoro Timer</h1>
    <div id="timer">25:00</div>
    <button id="startStopBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <br />
    <button id="musicToggle">Play Music</button>

    <audio id="backgroundMusic" loop>
      <source src="https://cdn.pixabay.com/download/audio/2022/03/25/audio_77d442bdca.mp3?filename=calm-ambient-music-13322.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const startStopBtn = document.getElementById('startStopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const timerDisplay = document.getElementById('timer');
    const musicToggle = document.getElementById('musicToggle');
    const backgroundMusic = document.getElementById('backgroundMusic');

    let workTime = 25 * 60;  // 25 minutes in seconds
    let breakTime = 5 * 60;  // 5 minutes break
    let isRunning = false;
    let isWorkSession = true;
    let timer;
    let timeLeft = workTime;

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;
    }

    function switchSession() {
      isWorkSession = !isWorkSession;
      timeLeft = isWorkSession ? workTime : breakTime;
      alert(isWorkSession ? 'Work session started!' : 'Break time! Relax a bit.');
      updateTimer();
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimer();
      } else {
        clearInterval(timer);
        switchSession();
        timer = setInterval(tick, 1000);
      }
    }

    startStopBtn.addEventListener('click', () => {
      if (!isRunning) {
        timer = setInterval(tick, 1000);
        startStopBtn.textContent = 'Pause';
        isRunning = true;
      } else {
        clearInterval(timer);
        startStopBtn.textContent = 'Start';
        isRunning = false;
      }
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timer);
      isRunning = false;
      isWorkSession = true;
      timeLeft = workTime;
      updateTimer();
      startStopBtn.textContent = 'Start';
    });

    musicToggle.addEventListener('click', () => {
      if (backgroundMusic.paused) {
        backgroundMusic.play();
        musicToggle.textContent = 'Pause Music';
      } else {
        backgroundMusic.pause();
        musicToggle.textContent = 'Play Music';
      }
    });

    updateTimer();
  </script>
</body>
</html>
