<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pomodoro Timer with Custom Durations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

  body {
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    font-family: 'Montserrat', sans-serif;
    margin: 0; padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #2c3e50;
  }
  .container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    text-align: center;
    width: 350px;
  }
  h1 {
    margin-bottom: 15px;
  }
  input[type=number] {
    width: 100%;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #74ebd5;
    margin-bottom: 15px;
    outline: none;
  }
  input[type=number]:focus {
    border-color: #3498db;
  }
  #streak {
    margin-top: 10px;
    font-weight: 600;
    font-size: 18px;
  }
  #timer {
    font-size: 48px;
    font-weight: 700;
    margin: 20px 0 10px;
  }
  .circle-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 10px;
  }
  svg {
    transform: rotate(-90deg);
  }
  circle {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
  }
  .background-circle {
    stroke: #e6e6e6;
  }
  .progress-circle {
    stroke: #74ebd5;
    transition: stroke-dashoffset 0.5s linear;
  }
  button {
    background-color: #2c3e50;
    color: white;
    border: none;
    padding: 14px 35px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-top: 10px;
  }
  button:hover {
    background-color: #34495e;
  }
  label {
    font-weight: 600;
    font-size: 14px;
    display: block;
    text-align: left;
    margin-bottom: 5px;
  }
  #modeLabel {
    font-weight: 700;
    margin-top: 15px;
    font-size: 20px;
  }
  #info {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
    min-height: 20px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Pomodoro Timer</h1>

    <label for="workDuration">Work session length (minutes):</label>
    <input id="workDuration" type="number" min="1" max="120" value="25" />

    <label for="breakDuration">Break length (minutes):</label>
    <input id="breakDuration" type="number" min="1" max="60" value="5" />

    <div class="circle-wrap">
      <svg width="180" height="180">
        <circle class="background-circle" cx="90" cy="90" r="80"></circle>
        <circle class="progress-circle" cx="90" cy="90" r="80" stroke-dasharray="502.65" stroke-dashoffset="502.65"></circle>
      </svg>
      <div id="timer">25:00</div>
    </div>

    <div id="modeLabel">Work</div>

    <button id="startStopBtn">Start</button>
    <div id="streak">Streak: 0</div>
    <div id="info"></div>
  </div>

<script>
  const startStopBtn = document.getElementById('startStopBtn');
  const timerDisplay = document.getElementById('timer');
  const progressCircle = document.querySelector('.progress-circle');
  const streakDisplay = document.getElementById('streak');
  const info = document.getElementById('info');
  const modeLabel = document.getElementById('modeLabel');
  const workDurationInput = document.getElementById('workDuration');
  const breakDurationInput = document.getElementById('breakDuration');

  const radius = 80;
  const circumference = 2 * Math.PI * radius;
  progressCircle.style.strokeDasharray = circumference;

  let isRunning = false;
  let timer = null;

  // State for timer mode: 'work' or 'break'
  let mode = 'work';

  // Durations in seconds
  function getWorkTime() {
    const val = parseInt(workDurationInput.value);
    return val > 0 ? val * 60 : 25 * 60;
  }
  function getBreakTime() {
    const val = parseInt(breakDurationInput.value);
    return val > 0 ? val * 60 : 5 * 60;
  }

  let timeLeft = getWorkTime();

  let streak = 0;
  streakDisplay.textContent = `Streak: ${streak}`;

  function updateTimerDisplay() {
    let minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    let seconds = (timeLeft % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${minutes}:${seconds}`;

    const totalTime = mode === 'work' ? getWorkTime() : getBreakTime();
    const progress = timeLeft / totalTime;
    progressCircle.style.strokeDashoffset = circumference * progress;
  }

  function resetTimer() {
    clearInterval(timer);
    isRunning = false;
    mode = 'work';
    timeLeft = getWorkTime();
    updateTimerDisplay();
    startStopBtn.textContent = 'Start';
    modeLabel.textContent = 'Work';
    info.textContent = '';
    streak = 0;
    streakDisplay.textContent = `Streak: ${streak}`;
  }

  function tick() {
    if(timeLeft > 0){
      timeLeft--;
      updateTimerDisplay();
    } else {
      clearInterval(timer);
      isRunning = false;

      if(mode === 'work'){
        streak++;
        streakDisplay.textContent = `Streak: ${streak}`;
        info.textContent = 'Work session complete! Take a break. ☕';
        mode = 'break';
        timeLeft = getBreakTime();
        modeLabel.textContent = 'Break';
      } else {
        info.textContent = 'Break over! Time to work! 💪';
        mode = 'work';
        timeLeft = getWorkTime();
        modeLabel.textContent = 'Work';
      }

      updateTimerDisplay();
      startStopBtn.textContent = 'Start';
    }
  }

  startStopBtn.addEventListener('click', () => {
    if(!isRunning){
      timer = setInterval(tick, 1000);
      isRunning = true;
      startStopBtn.textContent = 'Pause';
      info.textContent = '';
    } else {
      clearInterval(timer);
      isRunning = false;
      startStopBtn.textContent = 'Start';
      info.textContent = 'Paused.';
    }
  });

  // Reset timer when durations change
  workDurationInput.addEventListener('change', () => {
    if (isRunning) {
      clearInterval(timer);
      isRunning = false;
      startStopBtn.textContent = 'Start';
      info.textContent = 'Timer reset due to duration change.';
    }
    if(mode === 'work') timeLeft = getWorkTime();
    updateTimerDisplay();
    streak = 0;
    streakDisplay.textContent = `Streak: ${streak}`;
  });
  breakDurationInput.addEventListener('change', () => {
    if (isRunning) {
      clearInterval(timer);
      isRunning = false;
      startStopBtn.textContent = 'Start';
      info.textContent = 'Timer reset due to duration change.';
    }
    if(mode === 'break') timeLeft = getBreakTime();
    updateTimerDisplay();
  });

  updateTimerDisplay();
</script>

</body>
</html>
